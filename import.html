<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ورود گروهی قطعات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Tahoma, Arial, sans-serif; background: #EEF2F7; min-height: 100vh; color: #0F172A; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px; }
  h1 { color: #C8102E; font-size: 22px; margin-bottom: 6px; }
  .sub { color: #64748B; font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #C8102E; }
  input[type=file] { width: 100%; padding: 10px; border: 2px dashed #CBD5E1; border-radius: 10px; cursor: pointer; }
  .btn { padding: 14px 24px; background: #C8102E; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit; width: 100%; }
  .btn:hover { background: #9B0C23; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .btn-success { background: #16A34A; } .btn-success:hover { background: #15803D; }
  .progress-wrap { background: #F1F5F9; border-radius: 10px; overflow: hidden; height: 26px; margin: 14px 0; position: relative; }
  .progress-fill { background: linear-gradient(90deg, #C8102E, #9B0C23); height: 100%; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: bold; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
  .stat { background: #F8FAFC; padding: 12px; border-radius: 10px; text-align: center; }
  .stat .val { font-size: 20px; font-weight: bold; color: #C8102E; }
  .stat .lab { font-size: 11px; color: #64748B; margin-top: 4px; }
  .log { background: #0F172A; color: #E2E8F0; padding: 14px; border-radius: 10px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.6; }
  .log .ok { color: #4ADE80; }
  .log .skip { color: #FBBF24; }
  .log .err { color: #F87171; }
  .log .info { color: #60A5FA; }
  .preview { background: #F8FAFC; padding: 14px; border-radius: 10px; max-height: 200px; overflow: auto; font-size: 12px; margin: 14px 0; }
  .preview table { width: 100%; border-collapse: collapse; }
  .preview th, .preview td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #E2E8F0; }
  .preview th { background: #F1F5F9; font-weight: bold; }
  .hidden { display: none; }
  .status-bar { padding: 10px 14px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-bottom: 14px; }
  .status-ok { background: #DCFCE7; color: #166534; }
  .status-off { background: #FEE2E2; color: #991B1B; }
</style>
</head>
<body>
<div class="container">

  <!-- LOGIN CARD -->
  <div class="card" id="loginCard">
    <h1>🔐 ورود به سیستم</h1>
    <p class="sub">برای دسترسی به ابزار Import، ابتدا وارد شو.</p>
    <div class="field">
      <label>ایمیل ادمین</label>
      <input type="email" id="loginEmail" value="admin@baspar.local">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="loginPassword">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">ورود</button>
    <div id="loginError" style="color:#B91C1C;font-size:12px;margin-top:10px"></div>
  </div>

  <!-- IMPORT CARD -->
  <div class="card hidden" id="importCard">
    <h1>📦 ورود گروهی قطعات یدکی</h1>
    <p class="sub">فایل CSV (خروجی Excel) با ستون‌های <b>Register</b> و <b>Name</b> را انتخاب کن.</p>

    <div class="status-bar status-ok" id="statusBar">✅ لاگین شده</div>

    <div class="field">
      <label>۱. فایل CSV:</label>
      <input type="file" id="csvFile" accept=".csv">
    </div>

    <div id="previewBox"></div>

    <button class="btn" id="startBtn" disabled onclick="startImport()">🚀 شروع ورود</button>

    <div id="progressBox" class="hidden">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="val" id="sOk">0</div><div class="lab">موفق</div></div>
        <div class="stat"><div class="val" id="sSkip">0</div><div class="lab">تکراری/رد شده</div></div>
        <div class="stat"><div class="val" id="sErr">0</div><div class="lab">خطا</div></div>
        <div class="stat"><div class="val" id="sTotal">0</div><div class="lab">کل</div></div>
      </div>
      <div class="log" id="logBox"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.25.0/dist/pocketbase.umd.js"></script>
<script>
const pb = new PocketBase(window.location.origin);
let ROWS = [];
let stats = { ok: 0, skip: 0, err: 0 };
let EXISTING_REGISTERS = new Set();

// ===== LOGIN =====
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'در حال ورود...';

  
try {
    // اول تلاش با superuser (جدول _superusers)
    try {
      await pb.collection('_superusers').authWithPassword(email, password);
      showImport();
    } catch (err1) {
      // اگر نشد، با کاربران عادی
      await pb.collection('users').authWithPassword(email, password);
      showImport();
    }
  } catch (err) {
    errBox.textContent = '❌ ' + (err.message || 'خطا در ورود');
  } finally {



    btn.disabled = false;
    btn.textContent = 'ورود';
  }
}

function showImport() {
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('importCard').classList.remove('hidden');
  document.getElementById('statusBar').textContent = '✅ لاگین شده به عنوان: ' + (pb.authStore.model?.email || 'ادمین');
}

// ===== AUTO LOGIN =====
(function checkAuth() {
  if (pb.authStore.isValid) {
    showImport();
  }
})();

// ===== CSV PARSE =====
document.getElementById('csvFile').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  parseCSV(text);
});

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length === 0) { alert('فایل خالی است'); return; }

  const sep = lines[0].includes(';') ? ';' : ',';

  // هدر - به حروف بزرگ/کوچک حساس نیست
  const headers = lines[0].split(sep).map(function(h) {
    return h.trim().toLowerCase().replace(/["']/g, '');
  });

  // پیدا کردن ستون‌ها - انعطاف‌پذیر
  const idxReg = headers.findIndex(function(h) {
    return h === 'register' || h === 'registerno' || h === 'reg' ||
           h.includes('register') || h.includes('شماره');
  });
  const idxName = headers.findIndex(function(h) {
    return h === 'name' || h === 'partname' || h.includes('نام') || h.includes('name');
  });
  const idxCode = headers.findIndex(function(h) {
    return h === 'code' || h === 'partcode' || h.includes('کد');
  });
  const idxUnit = headers.findIndex(function(h) {
    return h === 'unit' || h.includes('واحد');
  });

  if (idxReg === -1 || idxName === -1) {
    alert('ستون‌های Register و Name پیدا نشد.\nهدرها: ' + headers.join(' | '));
    return;
  }

  log('ستون‌ها پیدا شد:', 'info');
  log('  Register → ستون ' + (idxReg + 1), 'info');
  log('  Name → ستون ' + (idxName + 1), 'info');

  ROWS = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseLine(lines[i], sep);
    const reg = (cols[idxReg] || '').trim();
    const name = (cols[idxName] || '').trim();
    if (!reg || !name) continue;
    ROWS.push({
      registerNo: reg,
      name: name,
      code: idxCode >= 0 && cols[idxCode] ? cols[idxCode].trim() : reg,
      unit: idxUnit >= 0 && cols[idxUnit] ? cols[idxUnit].trim() : 'pcs'
    });
  }

  const preview = ROWS.slice(0, 10);
  document.getElementById('previewBox').innerHTML =
    '<div class="preview">' +
      '<div style="font-weight:bold;margin-bottom:8px">پیش‌نمایش ۱۰ ردیف اول (از ' + ROWS.length + ' ردیف):</div>' +
      '<table><tr><th>registerNo</th><th>name</th><th>code</th><th>unit</th></tr>' +
      preview.map(function(r) {
        return '<tr><td>' + escapeHtml(r.registerNo) + '</td><td>' + escapeHtml(r.name) + '</td><td>' + escapeHtml(r.code) + '</td><td>' + escapeHtml(r.unit) + '</td></tr>';
      }).join('') +
      '</table></div>';

  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '🚀 شروع ورود (' + ROWS.length + ' رکورد)';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function parseLine(line, sep) {
  const result = [];
  let cur = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQuote = !inQuote; continue; }
    if (c === sep && !inQuote) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result.map(function(x) { return x.trim(); });
}

// ===== IMPORT =====
async function startImport() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('progressBox').classList.remove('hidden');

  // ۱. بارگذاری موجود - با pagination
  log('در حال بارگذاری قطعات موجود...', 'info');
  EXISTING_REGISTERS.clear();
  try {
    let page = 1;
    const perPage = 500;
    let totalPages = 1;
    while (page <= totalPages) {
      const res = await pb.collection('spare_parts').getList(page, perPage, {
        fields: 'id,registerNo'
      });
      totalPages = res.totalPages;
      res.items.forEach(function(p) {
        if (p.registerNo) EXISTING_REGISTERS.add(String(p.registerNo));
      });
      log('  صفحه ' + page + '/' + totalPages + ' — مجموع: ' + EXISTING_REGISTERS.size, 'info');
      page++;
    }
    log('✅ ' + EXISTING_REGISTERS.size + ' قطعه موجود در سیستم', 'ok');
  } catch (err) {
    log('❌ خطا در بارگذاری موجود: ' + err.message, 'err');
    log('  (اگر خطا 401 یا 403 است، دوباره لاگین کن)', 'err');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '🔄 تلاش مجدد';
    return;
  }

  // ۲. یکی‌یکی اضافه کن
  stats = { ok: 0, skip: 0, err: 0 };
  const total = ROWS.length;
  document.getElementById('sTotal').textContent = total;

  for (let i = 0; i < total; i++) {
    const row = ROWS[i];
    try {
      if (EXISTING_REGISTERS.has(String(row.registerNo))) {
        stats.skip++;
        document.getElementById('sSkip').textContent = stats.skip;
        if (stats.skip <= 15) log('⏭ رد: ' + row.registerNo + ' (تکراری)', 'skip');
      } else {
        await pb.collection('spare_parts').create({
          registerNo: row.registerNo,
          name: row.name,
          code: row.code,
          unit: row.unit
        });
        EXISTING_REGISTERS.add(String(row.registerNo));
        stats.ok++;
        document.getElementById('sOk').textContent = stats.ok;
        if (stats.ok <= 15) log('✅ ' + row.registerNo + ' — ' + row.name.substring(0, 40), 'ok');
      }
    } catch (err) {
      stats.err++;
      document.getElementById('sErr').textContent = stats.err;
      if (stats.err <= 15) log('❌ ' + row.registerNo + ' — ' + err.message.substring(0, 60), 'err');
    }

    if (i % 10 === 0 || i === total - 1) {
      const pct = Math.round(((i + 1) / total) * 100);
      const bar = document.getElementById('progressFill');
      bar.style.width = pct + '%';
      bar.textContent = pct + '% (' + (i + 1) + '/' + total + ')';
    }
  }

  log('═══════════════════════', '');
  log('✅ موفق: ' + stats.ok, 'ok');
  log('⏭ رد شده: ' + stats.skip, 'skip');
  log('❌ خطا: ' + stats.err, 'err');
  log('═══════════════════════', '');

  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '🔄 دوباره اجرا کن';
}

function log(msg, cls) {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
